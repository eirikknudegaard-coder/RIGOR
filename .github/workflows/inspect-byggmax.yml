name: Verify Byggmax public price format
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-byggmax.mjs'
      - '.github/workflows/inspect-byggmax.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: byggmax-inspection
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/inspect-byggmax.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: byggmax-inspection
          path: data/byggmax-inspection.json
  publish:
    needs: inspect
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/retain-price-register.mjs
      - uses: actions/download-artifact@v4
        with:
          name: byggmax-inspection
          path: data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
