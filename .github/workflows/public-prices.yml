name: Collect public material prices
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-public-prices.mjs'
      - 'market-public-core.js'
      - '.github/workflows/public-prices.yml'
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-material-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test rules
        run: node tests/market-public.test.mjs
      - name: Collect prices without AI
        id: collect
        continue-on-error: true
        run: node scripts/sync-public-prices.mjs
      - name: Publish register and run status
        run: |
          git config user.name 'RIGOR price sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-prices.json data/market-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public material price register'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-price-check
          path: |
            data/market-prices.json
            data/market-queue.json
      - name: Report failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
