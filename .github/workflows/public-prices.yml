name: Collect public material prices
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-public-prices.mjs'
      - 'scripts/probe-material-pages.mjs'
      - 'market-public-core.js'
      - '.github/workflows/public-prices.yml'
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-material-prices
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect supplier document format
        continue-on-error: true
        run: |
          node scripts/probe-material-pages.mjs
          python3 - <<'PYSUMMARY'
          import json, os
          with open('data/market-diagnostics.json') as f: evidence=json.load(f)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Supplier document evidence\n\n```json\n'+json.dumps(evidence,ensure_ascii=False).replace('<','\\u003c').replace('>','\\u003e')+'\n```\n')
          PYSUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-format
          path: data/market-diagnostics.json
  collect:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      collected: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test rules
        run: node tests/market-public.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: supplier-format
          path: data
      - name: Collect prices without AI
        id: collect
        continue-on-error: true
        env:
          RIGOR_CATALOG_BASE_URL: https://rigor.no
        run: node scripts/sync-public-prices.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-price-check
          path: |
            data/market-prices.json
            data/market-queue.json
            data/market-diagnostics.json
      - name: Report failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
  publish:
    needs: collect
    if: always() && (needs.collect.outputs.collected == 'success' || needs.collect.outputs.collected == 'failure')
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: public-price-check
          path: data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
